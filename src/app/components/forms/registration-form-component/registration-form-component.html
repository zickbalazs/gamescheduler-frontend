<mat-card>
  <mat-card-content class="me-3 mt-3">
    <mat-form-field>
      <mat-label>Username:</mat-label>
      <input type="text"
             [(ngModel)]="form.userName"
             matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Email address:</mat-label>
      <input type="email"
             [(ngModel)]="form.email"
             matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>SteamID:</mat-label>
      <input type="text"
             [(ngModel)]="form.steamId"
             matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password:</mat-label>
      <input type="password"
             [(ngModel)]="form.password"
             matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password again:</mat-label>
      <input type="password"
             [(ngModel)]="passAgain"
             matInput>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button matButton (click)="TryRegistration()">
      <mat-icon>add</mat-icon>
      Register
    </button>
  </mat-card-actions>
</mat-card>
