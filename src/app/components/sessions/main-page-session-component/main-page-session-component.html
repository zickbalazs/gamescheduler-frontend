@if(regData() | async; as reg){
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{reg.name}}
      </mat-card-title>
      <mat-card-subtitle>
        {{reg.start | date: 'long'}}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Start in:</p>
      <p>Your car: {{reg.car}}</p>
    </mat-card-content>
    <mat-card-actions>
      <button matButton
              [disabled]="!reg.canConnect" >Connection Details</button>
    </mat-card-actions>
  </mat-card>

}
