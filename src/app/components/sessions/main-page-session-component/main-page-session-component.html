@if(regData() | async; as reg){
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{reg.name}}
      </mat-card-title>
      <mat-card-subtitle>
        {{reg.start | date: 'long'}}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Your car: {{reg.car}}</p>
    </mat-card-content>
    <mat-card-actions>
      <button matButton
              [disabled]="!reg.canConnect"
              (click)="GetSessionData()">
        @if(reg.canConnect){
          Connection Details
        }
        @else{
          Please wait for session start.
        }
      </button>
      @if (!reg.canConnect){
        <button matButton (click)="CancelReg()">Cancel</button>
      }
    </mat-card-actions>
  </mat-card>

}
